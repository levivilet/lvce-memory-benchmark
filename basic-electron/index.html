<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Basic Electron Editor</title>
  <style>
    :root { color-scheme: light; font: 16px system-ui, sans-serif; }
    body { display: flex; flex-direction: column; gap: 12px; margin: 0; height: 100vh; }
    header { align-items: center; display: flex; gap: 16px; padding: 12px 16px; }
    button { font: inherit; padding: 6px 14px; }
    #status { color: #4b5563; }
    #status[data-state="error"] { color: #b91c1c; }
    #status[data-state="saved"] { color: #166534; }
    #editor { border: 1px solid #9ca3af; box-sizing: border-box; flex: 1; font: 15px/1.5 monospace; margin: 0 16px 16px; padding: 12px; resize: none; }
  </style>
</head>
<body>
  <header><button id="save" type="button">Save</button><span id="status" role="status">Loading…</span></header>
  <textarea id="editor" aria-label="File contents" spellcheck="false"></textarea>
  <script src="renderer.js"></script>
</body>
</html>
